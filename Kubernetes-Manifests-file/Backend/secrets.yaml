apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: hungerhaven
type: Opaque
stringData:
  # In-cluster Mongo connection string. Username/password must match
  # Database/secrets.yaml's MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD.
  MONGO_URI: "mongodb://admin:change-this-password@mongo-service:27017/gofoodmern?authSource=admin"
  # Secret used to sign JWT auth tokens. Use a long, random string.
  JWT_SECRET: "change-this-to-a-long-random-secret"
  # OpenCage Geocoding API key (https://opencagedata.com/)
  OPENCAGE_API_KEY: "your-opencage-api-key"
  # Replace before applying, e.g. via:
  #   kubectl create secret generic backend-secret \
  #     --namespace hungerhaven \
  #     --from-literal=MONGO_URI="mongodb://admin:<password>@mongo-service:27017/gofoodmern?authSource=admin" \
  #     --from-literal=JWT_SECRET="<long-random-secret>" \
  #     --from-literal=OPENCAGE_API_KEY="<your-opencage-key>"
