apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: hungerhaven
type: Opaque
stringData:
  # Credentials for the in-cluster MongoDB instance.
  # Replace these with real values before applying, e.g. via:
  #   kubectl create secret generic mongo-secret \
  #     --namespace hungerhaven \
  #     --from-literal=MONGO_ROOT_USERNAME=admin \
  #     --from-literal=MONGO_ROOT_PASSWORD=<strong-password> \
  #     --from-literal=MONGO_URI=mongodb://admin:<strong-password>@mongo-service:27017/gofoodmern?authSource=admin
  MONGO_ROOT_USERNAME: admin
  MONGO_ROOT_PASSWORD: change-this-password
  # This is what backend/.env's MONGO_URI should be replaced with once Mongo
  # runs in-cluster instead of Atlas. Keep the username/password in sync with
  # the two values above.
  MONGO_URI: "mongodb://admin:change-this-password@mongo-service:27017/gofoodmern?authSource=admin"
