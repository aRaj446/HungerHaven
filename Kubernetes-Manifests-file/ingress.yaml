apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hungerhaven-ingress
  namespace: hungerhaven
  annotations:
    # Requires the AWS Load Balancer Controller to be installed on the
    # cluster (via Helm) - it watches Ingress objects with this class and
    # provisions/manages an ALB automatically.
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/certificate-arn: <acm-cert-arn>  # add for HTTPS
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
