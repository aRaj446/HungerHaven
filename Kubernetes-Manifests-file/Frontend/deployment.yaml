apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: hungerhaven
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Placeholder - replace with your actual ECR image URI, e.g.:
          # <account-id>.dkr.ecr.<region>.amazonaws.com/hungerhaven-frontend:latest
          image: <ECR_URI>/hungerhaven-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
